version: 2
updates:
  # A "chore(scope): ..." prefix is required on every ecosystem here, otherwise
  # semantic-pr.yml rejects Dependabot's default "Bump x from y to z" titles.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - juliansteenbakker
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    reviewers:
      - juliansteenbakker
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gradle
    directory: /example/android
    schedule:
      interval: weekly
    reviewers:
      - juliansteenbakker
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    reviewers:
      - juliansteenbakker
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: weekly
    reviewers:
      - juliansteenbakker
    commit-message:
      prefix: chore
      include: scope
