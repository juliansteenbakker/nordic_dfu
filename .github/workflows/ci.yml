name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PUB_ENVIRONMENT: bot.github

jobs:
  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5

  analysis:
    name: Analysis (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Flutter version for the plugin. The example app
          # requires a newer Flutter than the plugin does, so it is skipped here.
          - name: "flutter-3.10"
            flutter-version: "3.10.x"
            pub-command: "get --no-example"
            analyze-paths: "lib"
          # Latest stable, which analyzes the plugin and the example app.
          - name: "latest"
            flutter-version: ""
            pub-command: "get"
            analyze-paths: "."
          # Lowest allowed versions of all dependencies, mirroring the
          # downgrade analysis that pub.dev runs when scoring the package.
          - name: "downgrade"
            flutter-version: ""
            pub-command: "downgrade --no-example"
            analyze-paths: "lib"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true

      - name: Flutter Version Info
        run: flutter doctor -v

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ matrix.name }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-${{ matrix.name }}-

      - name: Install Dependencies
        run: flutter pub ${{ matrix.pub-command }}

      - name: Lint Code
        run: flutter analyze ${{ matrix.analyze-paths }}

  formatting:
    name: Formatting
    needs: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-formatting-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-formatting-

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --set-exit-if-changed .

  # The jobs below build the example app on every platform the plugin
  # supports. `flutter analyze` never compiles the Kotlin or Swift sources, so
  # these are the only jobs that catch a broken native change.
  build_android:
    name: Android Build
    needs: formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'example/android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Example Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build apk --debug

  build_ios:
    name: iOS Build
    needs: formatting
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Example Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build ios --debug --no-codesign

  build_macos:
    name: macOS Build
    needs: formatting
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Example Dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Example App
        working-directory: example
        run: flutter build macos --debug
